# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: agent-framework-agent-basic-responses
requiredVersions:
    azd: '>=1.37.0'
    extensions:
        azure.ai.agents: '>=1.0.0'
services:
    handoff-azd-agent:
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: A basic Agent Framework agent hosted by Foundry.
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            PYTHONNOUSERSITE: "1"
        host: azure.ai.agent
        kind: hosted
        language: python
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: handoff-azd-agent
        project: src/agent-framework-agent-basic-responses
        protocols:
            - protocol: responses
              version: 2.0.0
        uses:
            - ai-project
    ai-project:
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 10
                name: GlobalStandard
        host: azure.ai.project
